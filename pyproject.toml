[project]
name = "o2view"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Frederik Krämer", email = "frdrkkraemer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dash>=3.2.0",
    "dash-iconify>=0.1.2",
    "dash-mantine-components>=2.3.0",
    "numpy>=2.3.3",
    "plotly>=6.3.1",
    "polars[excel]>=1.34.0",
    "pyjanitor>=0.31.0",
    "pywebview>=6.0",
    "scipy>=1.16.2",
    "setproctitle>=1.3.7",
]

[project.scripts]
o2view = "o2view.main:start"

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
